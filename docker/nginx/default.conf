server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 30m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Storefront bundle (hashed file names) and the Flutter web app. Entry documents are never cached.
    location /store/assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    # The web app manifest has no entry in nginx's mime.types: without this it is served as application/octet-stream and browsers ignore it.
    location = /store/manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
    location /store/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    # Firebase push service worker: generated by Laravel (it carries the Firebase settings saved in the dashboard), never a static file. The Flutter
    # web app would otherwise get its index.html for this path, and a service worker served as HTML is rejected by the browser.
    location = /firebase-messaging-sw.js { rewrite ^ /index.php last; }
    location = /mobile-web/firebase-messaging-sw.js { rewrite ^ /index.php last; }
    location = /mobile-web/index.html { add_header Cache-Control "no-cache"; }
    location = /mobile-web/flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /mobile-web/flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
    location /mobile-web/ { index index.html; try_files $uri $uri/ /mobile-web/index.html; }

    # Uploaded media (product pictures …): public/storage -> storage/app/public, mounted read-only from the app volume.
    location /storage/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }

    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location ~ /\.(?!well-known) { deny all; }

    # WebSockets (Laravel Reverb) for live auctions
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }
}
