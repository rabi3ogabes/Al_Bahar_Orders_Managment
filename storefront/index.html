<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8A1538" />
    <meta name="description" content="Al Bahar Home & Living — household essentials delivered across Qatar or ready to collect from a showroom." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- Installable as a Home Screen web app (iPhone and iPad only allow push for an installed app). No offline caching, no extra service worker. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Al Bahar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Al Bahar Home &amp; Living</title>
    <script>
      // Theme and language are applied before first paint so a dark or Arabic visitor never sees a light/English flash.
      try {
        var d = document.documentElement, th = localStorage.getItem('albahar.theme');
        if (th !== 'dark' && th !== 'light') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.dataset.theme = th;
        var lc = localStorage.getItem('albahar.locale');
        if (lc !== 'ar' && lc !== 'en') lc = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        d.lang = lc; d.dir = lc === 'ar' ? 'rtl' : 'ltr';
      } catch (e) { /* private mode: the app sets both after load */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
