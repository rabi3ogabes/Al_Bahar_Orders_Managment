# Local/staging stack. Production uses the same image with managed PostgreSQL/Redis, TLS at the load balancer,
# and secrets injected by the platform (never from files in the repository).
name: albahar

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: production
    args: { APP_VERSION: "${APP_VERSION:-dev}", APP_COMMIT: "${APP_COMMIT:-}", APP_BUILT_AT: "${APP_BUILT_AT:-}" }
  image: albahar/app:${APP_VERSION:-local}
  env_file: backend/.env
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    REVERB_HOST: reverb
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage/app

services:
  app:
    <<: *app
  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on: [app]
    restart: unless-stopped
  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,notifications,exports", "--tries=3", "--max-time=3600"]
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-albahar}
      POSTGRES_USER: ${DB_USERNAME:-albahar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"], interval: 5s, retries: 10 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
