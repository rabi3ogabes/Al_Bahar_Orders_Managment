name: Deploy

# Staging deploys from main automatically; production requires manual dispatch AND approval on the
# "production" GitHub environment (required reviewers). Secrets live only in GitHub environment secrets.
on:
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [staging, production], default: staging }
  push: { branches: [main] }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: "${{ vars.REGISTRY }}", username: "${{ secrets.REGISTRY_USER }}", password: "${{ secrets.REGISTRY_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: docker/php/Dockerfile, target: production, push: true, tags: "${{ vars.REGISTRY }}/albahar-app:${{ github.sha }}" }
      - name: Roll out (backup → migrate once → switch → restart workers)
        env: { DEPLOY_HOST: "${{ secrets.DEPLOY_HOST }}", DEPLOY_KEY: "${{ secrets.DEPLOY_SSH_KEY }}" }
        run: |
          install -m 600 /dev/null key && printf '%s' "$DEPLOY_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new deploy@"$DEPLOY_HOST" "cd /srv/albahar && ./ops/deploy.sh ${{ github.sha }}"
