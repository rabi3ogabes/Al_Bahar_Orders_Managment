name: Android APK

# Builds an installable test APK of the customer app against the live server and publishes it as a GitHub release.
# Run it from the Actions tab (or push a tag like apk-1). The APK is signed with the debug key until a release
# keystore is added (see mobile/android/key.properties handling in app/build.gradle.kts).
on:
  workflow_dispatch:
  push:
    tags: ['apk-*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.9', channel: stable, cache: true }
      - run: flutter pub get
      - name: Build APK
        run: >
          flutter build apk --release --flavor prod
          --dart-define=FLAVOR=prod
          --dart-define=API_BASE_URL=https://albahar.atharqatar.net/api/v1
          --dart-define=PUSH_ENABLED=false
      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-prod-release.apk "$RUNNER_TEMP/albahar.apk"
      - uses: actions/upload-artifact@v4
        with: { name: albahar-apk, path: '${{ runner.temp }}/albahar.apk' }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP/albahar.apk#albahar.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Al Bahar app (Android) build ${{ github.run_number }}" \
            --notes "Test build of the customer app, connected to https://albahar.atharqatar.net. Install the APK on an Android phone (allow installs from this source)."
