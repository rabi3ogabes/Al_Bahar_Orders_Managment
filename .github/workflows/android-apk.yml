name: Android APK

# Builds the THREE Android apps (customer, driver, branch staff) and publishes one GitHub release per app per run, so
# older builds stay available and you can always tell which one is installed: tag `<app>-<version>-b<build>`, file
# `albahar-<app>-<version>-b<build>-<commit>.apk`, notes with the commit and what changed since that app's previous build.
# The version/build/commit is baked into each app (customer: Settings -> About; driver and staff: sign-in screen footer).
#
# Runs automatically when the app changes on the development branch, or by hand from the Actions tab.
# The APK is signed with the debug key until a release keystore is added (see android/app/build.gradle.kts).
on:
  workflow_dispatch:
  push:
    branches: [claude/optimistic-euler-cffll1]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: customer, entry: lib/main.dart,        title: 'Customer app' }
          - { app: driver,   entry: lib/main_driver.dart, title: 'Driver app' }
          - { app: staff,    entry: lib/main_staff.dart,  title: 'Branch staff app' }
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.9', channel: stable, cache: true }
      - run: flutter pub get

      - name: Work out the version
        id: v
        run: |
          NAME=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          BUILD=${{ github.run_number }}
          SHA=$(git rev-parse --short=7 HEAD)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.app }}-$NAME-b$BUILD" >> "$GITHUB_OUTPUT"
          echo "file=albahar-${{ matrix.app }}-$NAME-b$BUILD-$SHA.apk" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: >
          flutter build apk --release --flavor ${{ matrix.app }}Prod -t ${{ matrix.entry }}
          --build-name=${{ steps.v.outputs.name }} --build-number=${{ steps.v.outputs.build }}
          --dart-define=FLAVOR=prod
          --dart-define=API_BASE_URL=https://albahar.atharqatar.net/api/v1
          --dart-define=PUSH_ENABLED=false
          --dart-define=BUILD_SHA=${{ steps.v.outputs.sha }}

      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-${{ matrix.app }}-prod-release.apk "$RUNNER_TEMP/${{ steps.v.outputs.file }}"

      - name: Release notes
        run: |
          PREV=$(git tag --list '${{ matrix.app }}-*' --sort=-creatordate | head -1 || true)
          {
            echo "## Al Bahar ${{ matrix.title }} ${{ steps.v.outputs.name }} (build ${{ steps.v.outputs.build }})"
            echo
            echo "- **Commit:** \`${{ steps.v.outputs.sha }}\` on \`${{ github.ref_name }}\`"
            echo "- **Built:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- **Server:** https://albahar.atharqatar.net"
            echo "- **Package:** \`$(case ${{ matrix.app }} in customer) echo qa.albahar.customer;; driver) echo qa.albahar.driver;; staff) echo qa.albahar.staff;; esac)\`"
            echo
            echo "### What changed"
            if [ -n "$PREV" ]; then git log "$PREV"..HEAD --no-merges --pretty='- %s' -- . ../backend ../storefront | head -25; else git log -10 --no-merges --pretty='- %s'; fi
            echo
            echo "Install: download the APK on an Android phone and allow installs from this source. A newer build installs over an older one of the same app. The three apps install side by side."
          } > "$RUNNER_TEMP/notes.md"

      - uses: actions/upload-artifact@v4
        with: { name: '${{ steps.v.outputs.file }}', path: '${{ runner.temp }}/${{ steps.v.outputs.file }}' }

      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "${{ steps.v.outputs.tag }}" "$RUNNER_TEMP/${{ steps.v.outputs.file }}" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "${{ matrix.title }} ${{ steps.v.outputs.name }} · build ${{ steps.v.outputs.build }} · ${{ steps.v.outputs.sha }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
